port = 5432
user = "nonbeing"
password = "nonbeing114514"
db_name = "vbep_cms"
ssl_mode = "disable"
time_zone = "Asia/Shanghai"

[redis]
addr = "127.0.0.1:6379"
password = ""
db = 0

[file]
upload_limit_application = 3
upload_limit_dataset = 2048
upload_limit_download = 512

[cron]
interval = 24
offset = 3

