app_name = "vbep-cms"
app_mode = "api"

[server]
ip = "0.0.0.0"
port = 8080
access_token_expired_duration = 15
refresh_token_expired_duration = 10080
refresh_token_cookie_name = "vbep_refresh_token"

[web]
url = "http://localhost:5173" # 配置部署环境的域名

[database]
db_type = "postgres"
host = "postgres"
port = 5432
#user = "nonbeing"
#password = "nonbeing114514"
db_name = "vbep_cms"
ssl_mode = "disable"
time_zone = "Asia/Shanghai"

[redis]
addr = "redis:6379"
password = ""
db = 0

[file]
upload_limit_application = 3
upload_limit_dataset = 2048
upload_limit_download = 512

[cron]
interval = 24
offset = 3

[email]
# driver: [smtp api mock]
driver = "smtp"
from = "vbepdata@muc.edu.cn"

[email.smtp]
host = "smtp.qiye.163.com" # 配置发件所用的smtp服务器
port = 465 # 465 使用 SSL 端口
user = "vbepdata@muc.edu.cn" # 登录smtp服务器的账号
password = "" # 登录smtp服务器的授权码（需在客户端设置中生成）

