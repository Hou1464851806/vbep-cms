# compose.yaml
# 所有服务都强制从本地缓存拉取镜像
services:
  postgres:
    image: postgres:15-alpine
    pull_policy: never
    container_name: vbep-cms-postgres
    restart: always
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: vbep_cms
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/db_user) -d vbep_cms"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_user
      - db_password

  redis:
    image: redis:7-alpine
    pull_policy: never
    container_name: vbep-cms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: vbep-cms/backend:latest
    pull_policy: never
    container_name: vbep-cms-backend
    restart: always
    environment:
      DB_USER_FILE: /run/secrets/db_user
      DB_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "8080:8080"
    volumes:
      - server-log:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - db_user
      - db_password

  frontend:
    image: vbep-cms/frontend:latest
    pull_policy: never
    container_name: vbep-cms-frontend
    restart: always
    ports:
      - "8888:80"
    volumes:
      - nginx-log:/var/log/nginx
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  server-log:
  nginx-log:

secrets:
  db_user:
    file: secrets/db_user.txt
  db_password:
    file: secrets/db_password.txt
